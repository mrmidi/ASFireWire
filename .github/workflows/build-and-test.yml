name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-26
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      LLVM_PROFILE_FILE: ${{ github.workspace }}/build/tests/%p-%m.profraw
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Install Dependencies
        run: |
          gem install xcpretty

      # ASFW.xcodeproj is generated from project.yml (XcodeGen) and gitignored,
      # so CI must generate it before anything can build. project.yml is the
      # only tracked source of truth for targets, settings, and schemes.
      - name: Generate ASFW.xcodeproj from project.yml (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate --quiet

      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.CERT_BASE_64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          # BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$BUILD_CERTIFICATE_BASE64" || -z "$P12_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "Signing secrets are unavailable; skipping certificate import."
            exit 0
          fi

          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.provisionprofile
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate to keychain
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          # echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          # mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles      
      
      - name: Generate Compilation Database
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.CERT_BASE_64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          chmod +x bump.sh
          ls -l bump.sh
          set -o pipefail
          CODE_SIGN_ARGS=()
          if [[ -z "$BUILD_CERTIFICATE_BASE64" || -z "$P12_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "Signing secrets are unavailable; building without code signing."
            CODE_SIGN_ARGS=(CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO)
          fi

          xcodebuild -project ASFW.xcodeproj \
            -scheme ASFW \
            -configuration Debug \
            -arch arm64 \
            -derivedDataPath build/DerivedData \
            clean build \
            "${CODE_SIGN_ARGS[@]}" \
            | tee xcodebuild.log \
            | xcpretty -r json-compilation-database --output compile_commands.json || {
              echo "::error::Build failed! Showing last 100 lines of log:"
              tail -n 100 xcodebuild.log
              exit 1
            }

      # The default build must NOT carry the SCSI personality (ASFW_ENABLE_SCSI
      # defaults to NO): with it present, any dext that stalls in the HBA start
      # chain can strand the registry into the 60 s busy-timeout boot panic.
      # Assert absence so a preprocessor regression cannot silently ship it.
      - name: Verify SCSI personality absent from default dext
        run: |
          PLIST=$(find build/DerivedData/Build/Products -path "*net.mrmidi.ASFW.ASFWDriver.dext/Info.plist" | head -1)
          if [[ -z "$PLIST" ]]; then
            echo "::error::Built dext Info.plist not found"
            exit 1
          fi
          plutil -lint "$PLIST"
          if /usr/libexec/PlistBuddy -c "Print :IOKitPersonalities:ASFWSCSIControllerService" "$PLIST" >/dev/null 2>&1; then
            echo "::error::ASFWSCSIControllerService personality present in the DEFAULT build (ASFW_ENABLE_SCSI should default to NO)"
            exit 1
          fi
          echo "SCSI personality absent from default build (expected)."

      - name: Configure Tests with Coverage
        run: |
          cmake -S tests -B build/tests \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate"

      - name: Build Tests
        run: |
          cmake --build build/tests --config Debug -j$(sysctl -n hw.ncpu)

      - name: Run Tests
        run: |
          cd build/tests
          ctest --output-on-failure -j$(sysctl -n hw.ncpu)

      - name: Process C++ Coverage
        run: |
          # Merge all profraw files into a single profdata file
          xcrun llvm-profdata merge -sparse build/tests/*.profraw -o coverage.profdata
          
          # Find all test executables in build/tests (excluding CMake artifacts)
          TEST_EXECUTABLES=$(find build/tests -type f -perm +111 -not -name "*.dylib" -not -name "*.a" -not -path "*/CMakeFiles/*" -not -path "*/_deps/*" -not -name "cmake" -not -name "ctest")
          
          # Construct the object args for llvm-cov
          OBJECT_ARGS=""
          for exe in $TEST_EXECUTABLES; do
            OBJECT_ARGS="$OBJECT_ARGS -object $exe"
          done
          
          # Generate coverage report excluding test files, stubs, and mocks
          xcrun llvm-cov show $OBJECT_ARGS \
            -instr-profile=coverage.profdata \
            --ignore-filename-regex='.*Tests\.cpp$' \
            --ignore-filename-regex='.*/tests/.*Stub\.cpp$' \
            --ignore-filename-regex='.*/tests/mocks/.*' \
            --ignore-filename-regex='.*/tests/LoggingStubs\.cpp$' \
            > coverage.txt

      - name: Install Sonar Build Wrapper (optional for C/C++ analysis)
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7
        if: runner.os == 'macOS' && env.SONAR_TOKEN != ''

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define "sonar.cfamily.compile-commands=compile_commands.json"
            --define "sonar.cfamily.llvm-cov.reportPath=coverage.txt"

      # REDUNDANT if generating compile_commands.json succeeded
      # - name: Build Driver
      #   run: |
      #     ./build.sh

  # The SCSI HBA is opt-in (ASFW_ENABLE_SCSI, ./build.sh --scsi) and OFF in the
  # default build above, so the Info.plist personality preprocessing and the
  # SCSI entitlement selection are never exercised by the main job. Build the
  # variant here so the gated configuration cannot rot while the flag stays
  # default-off — a malformed personality only surfaces on an opt-in user's
  # machine otherwise, and the failure mode there is a boot panic (#54).
  build-scsi:
    name: Build (SCSI HBA enabled)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # ASFW.xcodeproj is gitignored XcodeGen output, so this job must generate
      # it too — it drives xcodebuild directly rather than going through
      # build.sh, which would otherwise do the regeneration.
      - name: Generate ASFW.xcodeproj from project.yml (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate --quiet

      - name: Build Driver (ASFW_ENABLE_SCSI=YES)
        run: |
          set -o pipefail
          xcodebuild -project ASFW.xcodeproj \
            -scheme ASFW \
            -configuration Debug \
            -arch arm64 \
            -derivedDataPath build/DerivedData \
            build \
            ASFW_ENABLE_SCSI=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO \
            > xcodebuild-scsi.log 2>&1 || {
              echo "::error::SCSI-enabled build failed! Showing last 100 lines of log:"
              tail -n 100 xcodebuild-scsi.log
              exit 1
            }

      # The personality is injected by Info.plist preprocessing; assert it
      # actually landed in the built dext so a silent preprocessor regression
      # cannot pass CI.
      - name: Verify SCSI personality in built dext
        run: |
          PLIST=$(find build/DerivedData/Build/Products -path "*net.mrmidi.ASFW.ASFWDriver.dext/Info.plist" | head -1)
          if [[ -z "$PLIST" ]]; then
            echo "::error::Built dext Info.plist not found"
            exit 1
          fi
          plutil -lint "$PLIST"
          if ! /usr/libexec/PlistBuddy -c "Print :IOKitPersonalities:ASFWSCSIControllerService:IOClass" "$PLIST" >/dev/null 2>&1; then
            echo "::error::ASFWSCSIControllerService personality missing from built dext Info.plist despite ASFW_ENABLE_SCSI=YES"
            exit 1
          fi
          echo "SCSI personality present:"
          /usr/libexec/PlistBuddy -c "Print :IOKitPersonalities:ASFWSCSIControllerService" "$PLIST" | head -20
