name: Release (prebuilt tester build)

# Produces an unsigned ASFW.app plus a local installer for eager testers.
#   - Push a tag matching v*        -> tests, builds, packages, and attaches the zip to a GitHub Release.
#   - Run manually (workflow_dispatch) -> same, but uploads the zip as a workflow artifact only
#     (useful for testing this pipeline on a fork before tagging).
#
# The build is UNSIGNED by design (build.sh forces CODE_SIGNING_ALLOWED=NO). The ZIP
# carries install.sh and the entitlement resources; install.sh runs on the tester's
# Mac, ad-hoc signs the dext and app locally, checks SIP, and copies the result to
# /Applications. CI never receives or uses Apple signing credentials.
#
# THE TAG IS THE SOURCE OF TRUTH for the version. On a tag push the workflow overrides
# the driver's semantic version metadata and MARKETING_VERSION (the bundles'
# CFBundleShortVersionString), so a release can never disagree with its tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to attach assets to a Release on tag pushes

jobs:
  # Gate the release on the C++ suite. These run host-side with ASFW_HOST_TEST (no
  # hardware, no DriverKit), and `--test-only` exits with ctest's real status.
  # The Swift path is deliberately NOT used as a gate: run_swift_tests pipes xcodebuild
  # into `grep ... || true`, so it reports success even when tests fail (build.sh:235).
  # Swift/XCTest coverage comes from build-and-test.yml on PRs and main.
  test:
    name: C++ tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Run C++ test suite
        run: |
          chmod +x build.sh
          ./build.sh --test-only

  release:
    name: Build & package unsigned
    needs: test
    runs-on: macos-26
    env:
      CONFIGURATION: Release
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version

      # Derive every version string from the tag so they cannot drift apart.
      # There are two independent sources in the repo:
      #   VERSION.txt      -> bump.sh -> DriverVersion.hpp (driver's kSemanticVersion)
      #   project.yml      -> MARKETING_VERSION -> CFBundleShortVersionString
      # CFBundleShortVersionString stays numeric and matches the release tag.
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            FULL="${GITHUB_REF_NAME#v}"
          else
            FULL="0.0.0-dev.${GITHUB_SHA:0:8}"
          fi
          NUMERIC="${FULL%%-*}"; NUMERIC="${NUMERIC%%+*}"
          if ! printf '%s' "$NUMERIC" | grep -qE '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not yield a numeric version (got '${NUMERIC}'). Use vMAJOR.MINOR.PATCH[-suffix]."
            exit 1
          fi
          echo "full=$FULL"       >> "$GITHUB_OUTPUT"
          echo "numeric=$NUMERIC" >> "$GITHUB_OUTPUT"
          echo "Release version: $FULL (CFBundleShortVersionString $NUMERIC)"

      # ASFW.xcodeproj is gitignored XcodeGen output — build.sh regenerates it,
      # but only when xcodegen is on PATH, so install it before building.
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # ASFW_VERSION_OVERRIDE stamps the tag's version without touching VERSION.txt.
      # Writing that tracked file would leave the tree dirty, and bump.sh would then
      # record kGitDirty = true — every release would report itself as a dirty build.
      - name: Stamp version into the driver header
        env:
          ASFW_VERSION_OVERRIDE: ${{ steps.version.outputs.full }}
        run: |
          chmod +x build.sh bump.sh install.sh
          ./bump.sh refresh
          grep -E 'kSemanticVersion|kGitDirty' ASFWDriver/Version/DriverVersion.hpp
          git diff --quiet || { echo "::error::Working tree dirty before build — the release would be stamped DIRTY."; git status --short; exit 1; }

      - name: Build (Release, unsigned by design)
        run: |
          ./build.sh --no-bump --config Release \
            --set MARKETING_VERSION="${{ steps.version.outputs.numeric }}"

      - name: Package unsigned app and local installer
        id: package
        run: |
          APP="build/DerivedData/Build/Products/Release/ASFW.app"
          [ -d "$APP" ] || { echo "::error::App not found at $APP"; exit 1; }
          STAGE="$RUNNER_TEMP/ASFW-${{ steps.version.outputs.full }}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Entitlements"
          ditto --rsrc --extattr --acl "$APP" "$STAGE/ASFW.app"
          install -m 0755 install.sh "$STAGE/install.sh"
          install -m 0644 ASFW/App.entitlements "$STAGE/Entitlements/App.entitlements"
          install -m 0644 ASFWDriver/ASFWDriver.entitlements "$STAGE/Entitlements/ASFWDriver.entitlements"
          ZIP="ASFW-${{ steps.version.outputs.full }}.zip"
          ditto -c -k --keepParent "$STAGE" "$ZIP"
          SHA="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Packaged $ZIP ($SHA)"

      # Release body = the CHANGELOG section matching this tag (when present) plus a
      # fixed install/safety footer. The footer is unconditional: the SIP boot-loop
      # warning must appear on every release regardless of changelog state.
      - name: Compose release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.full }}"
          : > NOTES.md
          if [ -f CHANGELOG.md ]; then
            # index(...)==1 is a literal anchored match — avoids treating '.' / '+'
            # in the version as regex metacharacters.
            awk -v hdr="## [$VERSION]" '
              index($0, hdr) == 1 { grab = 1; next }
              grab && /^## / { exit }
              grab { print }
            ' CHANGELOG.md | sed -e '/./,$!d' > SECTION.md
            if [ -s SECTION.md ]; then
              cat SECTION.md >> NOTES.md
              printf '\n' >> NOTES.md
            else
              echo "::warning::No '## [${VERSION}]' section in CHANGELOG.md — publishing with install/safety notes only."
            fi
          fi
          cat >> NOTES.md <<EOF
          ## Install

          Experimental prebuilt tester bundle — the app is unsigned until \`install.sh\` runs locally.
          The installer checks that SIP is disabled, ad-hoc signs the app and dext, and copies
          the result to \`/Applications\`.

          Run \`./install.sh\` from the extracted release directory. It does not collect or upload
          Apple ID passwords, and it does not require an Apple Developer account or provisioning
          profile for this ad-hoc test install.

          Read the **[Installing guide](https://github.com/mrmidi/ASFireWire/wiki/Installing)** before installing.
          Hitting problems? **[Troubleshooting](https://github.com/mrmidi/ASFireWire/wiki/Troubleshooting)** ·
          **[Reporting Issues](https://github.com/mrmidi/ASFireWire/wiki/Reporting-Issues)**

          > [!WARNING]
          > **Uninstall the extension _before_ re-enabling SIP.** This experimental installer
          > intentionally requires SIP to be disabled and refuses to install otherwise.
          >
          > Recovery, should a boot problem occur: Recovery → \`csrutil disable\` → boot → \`systemextensionsctl uninstall - net.mrmidi.ASFW.ASFWDriver\` → \`csrutil enable\`.

          Requires an Apple Silicon Mac on macOS 26 (Tahoe) and FireWire hardware
          (PCIe OHCI card, or an Apple Thunderbolt-to-FireWire adapter).

          \`\`\`
          SHA-256  ${{ steps.package.outputs.sha }}
          \`\`\`
          EOF
          echo "--- release notes ---"; cat NOTES.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          # No .zip suffix: artifact downloads are zip containers themselves,
          # so a .zip name would yield ASFW-x.zip.zip.
          name: ASFW-${{ steps.version.outputs.full }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - name: Attach to Release (tag pushes only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.package.outputs.zip }}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file NOTES.md \
            --prerelease \
          || gh release upload "${GITHUB_REF_NAME}" "${{ steps.package.outputs.zip }}" --clobber
